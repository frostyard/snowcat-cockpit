name: Publish worker images

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: worker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.provider }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: codex
            file: oci/Containerfile
          - provider: claude
            file: oci/Claude.Containerfile
          - provider: copilot
            file: oci/Copilot.Containerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ matrix.provider }}-${{ github.ref_name }}

      - name: Record immutable digest
        env:
          PROVIDER: ${{ matrix.provider }}
          IMAGE: ghcr.io/${{ github.repository }}-worker:${{ matrix.provider }}-${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf "### %s worker image\n\n\`%s@%s\`\n" \
            "$PROVIDER" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
