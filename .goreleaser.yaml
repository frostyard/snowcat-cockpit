# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
pro: true

project_name: snowcat-cockpit

metadata:
  description: Node-local execution surface for external Snowcat workers
  homepage: https://github.com/frostyard/snowcat-cockpit

snapshot:
  version_template: "{{ .ShortCommit }}-snapshot"

gomod:
  proxy: false

before:
  hooks:
    - go mod tidy

builds:
  - id: snowcat-cockpit
    binary: snowcat-cockpit
    main: ./cmd/snowcat-cockpit
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }} -X main.builtBy=goreleaser

archives:
  - files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"
      - "go mod tidy"
  groups:
    - title: Dependency updates
      regexp: "^.*feat\\(deps\\)*:+.*$"
      order: 300
    - title: New features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: Documentation updates
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: Other work
      order: 9999

nfpms:
  - file_name_template: "{{ .ConventionalFileName }}"
    package_name: frostyard-snowcat-cockpit
    description: Node-local execution surface for external Snowcat workers
    dependencies: [git, tmux]
    formats: [deb, rpm, apk]

release:
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/frostyard/{{ .ProjectName }}/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    _Released with [GoReleaser Pro](https://goreleaser.com/pro)!_

nightly:
  version_template: "{{ incmajor .Version }}-dev"
  tag_name: dev
  publish_release: true
  keep_single_release: true
